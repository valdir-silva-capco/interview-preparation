services:
  web:
    build:
      context: .
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:3000/api/v1}
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - .:/app
      - web_node_modules:/app/node_modules
    restart: unless-stopped

volumes:
  web_node_modules:
