services:
  api:
    build:
      context: .
      target: development
    environment:
      NODE_ENV: development
      PORT: 3000
      CORS_ORIGIN: http://localhost:5173
      AUTH_TOKEN_SECRET: ${AUTH_TOKEN_SECRET:?Set AUTH_TOKEN_SECRET in backend/.env}
      ROOT_EMAIL: ${ROOT_EMAIL:-valdir.silva@capco.com}
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USER: ${POSTGRES_USER:-interview_app}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_only_change_me}
      DATABASE_NAME: ${POSTGRES_DB:-interview_preparation}
      RUNNER_SOCKET_PATH: /run/code-runner/runner.sock
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - .:/app
      - api_node_modules:/app/node_modules
      - runner_socket:/run/code-runner
    command: sh -c "npm run build && npm run migration:run && npm run start:dev"
    depends_on:
      postgres:
        condition: service_healthy
      code-runner:
        condition: service_healthy
    networks:
      - app
      - edge
    restart: unless-stopped

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-interview_preparation}
      POSTGRES_USER: ${POSTGRES_USER:-interview_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_dev_only_change_me}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 12
    networks:
      - app
    restart: unless-stopped

  code-runner:
    build:
      context: ./code-runner
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
    volumes:
      - runner_socket:/run/code-runner
    network_mode: none
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    pids_limit: 32
    mem_limit: 512m
    cpus: 1.0
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('node:http').get({socketPath:'/run/code-runner/runner.sock',path:'/health'},r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

volumes:
  api_node_modules:
  postgres_data:
  runner_socket:

networks:
  app:
    internal: true
  edge:
